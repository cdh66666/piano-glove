<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">钢琴手套使用流程：连接、编号、舒适行程、动作与曲目</title>
  <desc id="desc">四步使用流程。USB连接ESP32主控和同型号六台舵机，确认编号1到6，记录实际舒适行程，再主动开始动作或曲目。PDF校对和曲库是单独的软件分支，需要人工复核。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 2 10 6 2 10" fill="none" stroke="#13a6b3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#142d4e}
      .title{font-size:43px;font-weight:700}.sub{font-size:25px;fill:#65758b}.step{font-size:31px;font-weight:700}.body{font-size:23px;fill:#4c6079}.small{font-size:21px;fill:#65758b}.white{fill:#fff}.cyan{fill:#078d9b}.label{font-size:20px;font-weight:700;letter-spacing:1px}.number{font-size:25px;font-weight:700}
      .line{fill:none;stroke:#13a6b3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.navyline{fill:none;stroke:#284968;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="#fff"/>
  <rect x="52" y="47" width="7" height="54" rx="3.5" fill="#13a6b3"/>
  <text class="title" x="80" y="91">钢琴手套 · 从连接到演奏</text>
  <text class="sub" x="80" y="137">先确认硬件和行程，再主动开始动作</text>
  <rect x="1175" y="54" width="210" height="41" rx="20" fill="#e8f8fa"/>
  <text class="cyan" x="1197" y="82" font-size="19" font-weight="700">使用流程 / 2026.10</text>

  <g>
    <rect x="52" y="191" width="304" height="347" rx="22" fill="#f5f8fc" stroke="#e0e8f1"/>
    <circle cx="88" cy="227" r="18" fill="#142d4e"/><text class="label white" x="82" y="234">1</text>
    <text class="step" x="119" y="239">连接硬件</text>
    <rect x="121" y="279" width="100" height="64" rx="12" fill="#fff" stroke="#284968" stroke-width="3"/>
    <path class="navyline" d="M139 303h22v17h-22zM176 299h26M176 311h26M176 323h16M121 311H94v-23M221 311h30"/>
    <path class="line" d="M251 311v-15m0 15v16m0-16h20"/>
    <g fill="#13a6b3"><circle cx="280" cy="288" r="6"/><circle cx="300" cy="288" r="6"/><circle cx="280" cy="310" r="6"/><circle cx="300" cy="310" r="6"/><circle cx="280" cy="332" r="6"/><circle cx="300" cy="332" r="6"/></g>
    <text class="body" x="76" y="399">USB 连接 ESP32 主控</text>
    <text class="body" x="76" y="440">同型号六台舵机接总线</text>
    <text class="small" x="76" y="497">SC09 与 STS 不混接</text>
  </g>
  <g>
    <rect x="396" y="191" width="304" height="347" rx="22" fill="#f5f8fc" stroke="#e0e8f1"/>
    <circle cx="432" cy="227" r="18" fill="#142d4e"/><text class="label white" x="426" y="234">2</text>
    <text class="step" x="463" y="239">确认编号</text>
    <g fill="#fff" stroke="#b9dce3" stroke-width="2">
      <rect x="424" y="285" width="34" height="53" rx="8"/><rect x="467" y="285" width="34" height="53" rx="8"/><rect x="510" y="285" width="34" height="53" rx="8"/><rect x="553" y="285" width="34" height="53" rx="8"/><rect x="596" y="285" width="34" height="53" rx="8"/><rect x="639" y="285" width="34" height="53" rx="8"/>
    </g>
    <g class="number cyan"><text x="433" y="321">1</text><text x="476" y="321">2</text><text x="519" y="321">3</text><text x="562" y="321">4</text><text x="605" y="321">5</text><text x="648" y="321">6</text></g>
    <text class="body" x="420" y="399">逐槽确认 ID 1～6 在线</text>
    <text class="body" x="420" y="440">首次按提示逐台接入</text>
    <text class="small" x="420" y="497">中断后可保持接线续编</text>
  </g>
  <g>
    <rect x="740" y="191" width="304" height="347" rx="22" fill="#f5f8fc" stroke="#e0e8f1"/>
    <circle cx="776" cy="227" r="18" fill="#142d4e"/><text class="label white" x="770" y="234">3</text>
    <text class="step" x="807" y="239">记录舒适行程</text>
    <path d="M785 328H998" stroke="#dce6ef" stroke-width="13" stroke-linecap="round"/>
    <path d="M819 328H960" stroke="#9fe0e7" stroke-width="13" stroke-linecap="round"/>
    <path class="line" d="M818 302v51m143-51v51M840 285h98" marker-end="url(#arrow)"/>
    <circle cx="882" cy="328" r="12" fill="#078d9b" stroke="#fff" stroke-width="4"/>
    <text class="body" x="764" y="399">实际完整往返一次</text>
    <text class="body" x="764" y="440">最后自然放松，再保存</text>
    <text class="small" x="764" y="497">用本副手套的实测范围</text>
  </g>
  <g>
    <rect x="1084" y="191" width="304" height="347" rx="22" fill="#eaf9fa" stroke="#b4e3e8"/>
    <circle cx="1120" cy="227" r="18" fill="#078d9b"/><text class="label white" x="1114" y="234">4</text>
    <text class="step" x="1151" y="239">动作与曲目</text>
    <rect x="1142" y="280" width="122" height="66" rx="10" fill="#fff" stroke="#284968" stroke-width="3"/>
    <path d="m1192 295 27 17-27 18z" fill="#078d9b"/>
    <path class="navyline" d="M1291 316v-27l30-7v27"/><ellipse cx="1285" cy="319" rx="9" ry="6" fill="#284968"/><ellipse cx="1315" cy="312" rx="9" ry="6" fill="#284968"/>
    <text class="body" x="1108" y="399">单指／组合／交替</text>
    <text class="body" x="1108" y="440">曲目演奏与同步测速</text>
    <text class="small" x="1108" y="497">每次主动点击才开始</text>
  </g>
  <g class="line" marker-end="url(#arrow)"><path d="M365 365h21"/><path d="M709 365h21"/><path d="M1053 365h21"/></g>

  <rect x="52" y="581" width="1336" height="204" rx="22" fill="#fff" stroke="#dce5ef" stroke-width="2"/>
  <rect x="76" y="604" width="114" height="32" rx="16" fill="#edf2f8"/>
  <text class="label" x="97" y="627">软件分支</text>
  <text x="76" y="682" font-size="29" font-weight="700">PDF 与曲库</text>
  <text class="small" x="76" y="724">与编号、校准分开操作</text>
  <g font-size="25" font-weight="700" text-anchor="middle">
    <rect x="410" y="621" width="180" height="70" rx="14" fill="#f5f8fc"/><text x="500" y="664">导入 PDF</text>
    <rect x="651" y="621" width="180" height="70" rx="14" fill="#eaf9fa" stroke="#9dd8df"/><text x="741" y="664">人工校对</text>
    <rect x="892" y="621" width="180" height="70" rx="14" fill="#f5f8fc"/><text x="982" y="664">保存曲库</text>
    <rect x="1133" y="621" width="212" height="70" rx="14" fill="#f5f8fc"/><text x="1239" y="664">选择演奏</text>
  </g>
  <g class="line" marker-end="url(#arrow)"><path d="M605 656h29"/><path d="M846 656h29"/><path d="M1087 656h29"/></g>
  <text class="small" x="410" y="741">自动转换后仍需核对音符、节奏和指法；校对通过后再用于演奏。</text>
  <path d="M52 826h1336" stroke="#e5ebf2"/>
  <circle cx="65" cy="858" r="6" fill="#13a6b3"/>
  <text class="small" x="84" y="865">界面检查、通信回读、台架动作与穿戴体验分别验收。</text>
</svg>
