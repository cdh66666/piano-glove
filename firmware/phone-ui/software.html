<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钢琴手套 · 软件训练</title><link rel="stylesheet" href="software.css"></head>
<body><header><h1>钢琴手套</h1><span id="connection">正在读取设备</span><button id="stop" class="stop">停止</button></header>
<nav aria-label="功能"><button data-tab="train" class="selected">手指训练</button><button data-tab="library">曲库</button><button data-tab="convert" id="convert-tab">PDF 识谱</button><a href="web_piano_glove.html?simple=1">调手套</a></nav>
<main><div class="settings"><label>速度 <input id="tempo" type="range" min="50" max="1000" value="100" step="5"><output id="tempo-label">100%</output></label><div id="tempo-steps" class="tempo-steps" aria-label="速度快捷键"><button type="button" data-step="-10">−10%</button><button type="button" data-rate="50">50%</button><button type="button" data-rate="75">75%</button><button type="button" data-rate="100">100%</button><button type="button" data-rate="150">150%</button><button type="button" data-rate="max">最快</button><button type="button" data-step="10">＋10%</button></div><label>幅度 <input id="amplitude" type="range" min="1" max="100" step="1" value="100"><output id="amplitude-label">100%</output></label><label>保持阻力 <input id="hold" type="range" min="0" max="100" value="100" step="10"><output id="hold-label">100%</output></label><label class="sound"><input id="sound" type="checkbox" checked>声音</label><span id="audio-status" class="audio-status" role="status"></span></div>
<section id="player" hidden aria-label="曲谱演奏"><div class="player-heading"><button id="player-back">返回曲库</button><h2 id="player-title">曲谱演奏</h2><button id="player-replay">重新开始</button></div><div class="play-progress"><span id="player-time">0:00 / 0:00</span><progress id="player-progress" max="1" value="0" aria-label="演奏进度"></progress><strong id="player-note">准备中</strong></div><div class="player-body"><div class="score-stage"><div class="score-toolbar"><strong id="player-source-label">音符进度</strong><span id="player-source-page"></span><button id="player-source-prev" hidden aria-label="原谱上一页">上一页</button><button id="player-source-next" hidden aria-label="原谱下一页">下一页</button></div><div id="player-source" hidden><div id="player-source-paper"><img id="player-source-image" alt="当前曲目原PDF页面"><div id="player-source-cursor" hidden></div></div></div><div id="player-timeline" role="img" aria-label="当前音符与右手指法进度"></div><p id="player-source-hint">未关联原谱，显示曲谱中的音符与指法</p></div><div id="player-feedback"></div></div></section>
<div id="feedback-home">
<section id="feedback-panel"><div class="heading"><h2>右手</h2><span id="player-finger-cue" hidden></span></div><svg id="player-hand" hidden viewBox="0 0 360 230" aria-label="右手当前按键" role="img"><path class="hand-palm" d="M107 114Q85 153 107 193Q130 224 212 219Q271 215 279 178L287 111Z"/><path id="hand-finger-0" class="hand-digit" d="M113 174L61 129Q45 111 32 125Q23 138 38 152L83 195Q110 220 125 190Z"/><path id="hand-finger-1" class="hand-digit" d="M108 135V48Q108 31 124 31Q140 31 140 48V129Z"/><path id="hand-finger-2" class="hand-digit" d="M154 128V24Q154 7 171 7Q188 7 188 24V128Z"/><path id="hand-finger-3" class="hand-digit" d="M203 129V38Q203 21 220 21Q237 21 237 38V131Z"/><path id="hand-finger-4" class="hand-digit" d="M252 137V78Q252 62 268 62Q284 62 284 78V149Z"/><text x="48" y="140">1</text><text x="124" y="77">2</text><text x="171" y="65">3</text><text x="220" y="77">4</text><text x="268" y="110">5</text></svg><div class="fingers" id="fingers"></div><aside class="pose-feedback"><span title="拇指姿态">姿态 ID1</span><div id="thumb-pose"></div></aside></section>
</div>
<section id="train"><h2>训练</h2><div class="actions"><button id="fastest-training">最快速度</button><button data-pattern="single">逐指</button><button data-pattern="combination">组合</button><button data-pattern="alternating">交替</button><label>次数 <input id="repeats" type="number" min="1" max="20" value="3"></label></div><p id="training-status" class="local-status" role="status" aria-live="polite">就绪</p></section>
<section id="library" hidden><div class="heading"><h2>曲库</h2><button id="max-score-tempo">曲谱1000%</button><button id="refresh">刷新</button></div><p id="capacity">正在读取存储</p><div id="songs"></div><div class="upload"><label>曲目位置 <input id="slot" type="number" min="1" max="100" value="1"></label><input id="pgl" type="file" accept=".pgl"><button id="upload">上传曲谱</button></div></section>
<section id="convert" hidden><h2>带指法 PDF 转换</h2><div class="actions"><input id="pdf" type="file" accept=".pdf"><label>每分钟拍数 <input id="bpm" type="number" min="10" max="240" value="120"></label><button id="recognize">识别</button><input id="review-file" type="file" accept=".json"><button id="save-review">保存复核进度</button><button id="add-note">补录音符</button></div><p id="report">选择原 PDF。识别结果需对照原谱复核后导出。</p>
<div id="notation-options" class="notation-options" hidden><div id="repeat-options" hidden><label><input id="repeat-unfold" type="checkbox">按反复演奏</label><span id="repeat-summary"></span><label><input id="repeats-reviewed" type="checkbox">已核对反复与房号</label></div><div id="tie-options" hidden><label><input id="tie-apply" type="checkbox">连音不断开</label><span id="tie-summary"></span><label><input id="ties-reviewed" type="checkbox">已核对连音</label></div></div>
<div class="review-grid"><div><div class="actions"><button id="original-prev">上一页</button><span id="original-page-label">原谱</span><button id="original-next">下一页</button><label>缩放 <input id="original-zoom" type="range" min="75" max="200" value="100" step="25"></label></div><div id="original"><img id="original-image" alt="原PDF页面" hidden><p id="original-empty">识别后显示原谱真实页面</p></div></div><div><div class="actions"><label>起始拍 <input id="start-beat" type="number" min="0" step="0.25" value="0"></label><label>结束拍 <input id="end-beat" type="number" min="0" step="0.25" placeholder="全部"></label><label>起始页 <input id="start-page" type="number" min="1" placeholder="全部"></label><label>结束页 <input id="end-page" type="number" min="1" placeholder="全部"></label></div><div id="review-notes"></div><label><input id="range-reviewed" type="checkbox">已对照原谱确认所选区间无漏音</label><button id="export">导出已复核 .pgl</button></div></div></section>
<footer><strong id="activity">待机</strong><small id="sync">等待设备时钟</small><p id="message" role="status" aria-live="polite"></p></footer></main><script src="software-audio.js"></script><script src="software.js"></script></body></html>
