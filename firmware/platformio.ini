; 钢琴手套 · 主控固件（自研，替代原厂闭源 PIANO_GLOVE_1）
;
; 板子：微雪 Servo Driver with ESP32 (SKU 21593)
;       ESP32-D0WD-V3 rev3.1 / 4MB Flash / CP2102
;       实测确认：esptool 读到 MAC 28:05:a5:c4:f1:88
;
; 编译： pio run -d firmware
; 烧录： pio run -d firmware -t upload
; 串口： 115200 8N1（与上位机 web_piano_glove.html / glove_fw.py 一致）

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32@6.4.0
board     = esp32dev
framework = arduino

; 上位机固定 115200，这里别改
monitor_speed = 115200
monitor_filters = direct

; CP2102 上 460800 实测会读校验错（备份 flash 时踩过），烧录统一用 230400
upload_speed = 230400

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall

; 本项目零第三方库依赖（只用 Arduino 核心 + Preferences）
lib_deps =
