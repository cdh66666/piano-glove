<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校准全过程轨迹</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111820;color:#edf7ff;font:15px system-ui;padding:24px}main{max-width:1300px;margin:auto}h1{font-size:25px}p{color:#abc1d4}section{padding:20px;background:#1b2531;border:1px solid #354859;border-radius:18px;margin:16px 0}canvas{width:100%;height:245px;display:block}h2{font-size:17px;margin:0 0 12px}a{color:#6fe2f9}.error{color:#ffb0b0}</style>
<main><h1>校准全过程轨迹</h1><p id="status">正在读取…</p><section><h2>连续展开 · 软件计算，原始读数见下图</h2><canvas id="continuous"></canvas></section><section><h2>原始位置 · 保留每一帧读数</h2><canvas id="raw"></canvas></section><a id="data" hidden>查看原始记录</a></main>
<script>
'use strict';
function plot(canvas,frames,field,standby){const width=canvas.clientWidth,height=245,dpr=devicePixelRatio||1;canvas.width=width*dpr;canvas.height=height*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const values=frames.map(f=>f[field]),min=values.reduce((m,v)=>Math.min(m,v),Infinity),max=values.reduce((m,v)=>Math.max(m,v),-Infinity),span=Math.max(1,max-min),end=Math.max(1,frames.at(-1).t_ms),left=62,right=width-16,top=18,bottom=height-30;const x=t=>left+(right-left)*t/end,y=v=>bottom-(bottom-top)*(v-min)/span;c.font='12px system-ui';c.strokeStyle='#354859';c.fillStyle='#abc1d4';for(let i=0;i<=4;i++){const value=min+span*i/4,py=y(value);c.beginPath();c.moveTo(left,py);c.lineTo(right,py);c.stroke();c.fillText(value.toFixed(1),4,py+4);}if(Number.isFinite(standby)){c.setLineDash([5,5]);c.strokeStyle='#f8d37b';c.beginPath();c.moveTo(left,y(standby));c.lineTo(right,y(standby));c.stroke();c.setLineDash([]);}c.strokeStyle='#60e3f5';c.lineWidth=1.5;c.beginPath();frames.forEach((f,i)=>{if(i)c.lineTo(x(f.t_ms),y(f[field]));else c.moveTo(x(f.t_ms),y(f[field]));});c.stroke();c.fillText('0 秒',left,height-8);c.fillText((end/1000).toFixed(2)+' 秒',right-65,height-8);}
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!/^[a-f0-9]{32}$/.test(id||''))throw Error('记录编号无效');const url='/api/calibration/recording?id='+id,response=await fetch(url);if(!response.ok)throw Error('记录读取失败');const data=await response.json(),names=['拇指按压','拇指侧摆','食指','中指','无名指','小指'];document.getElementById('status').textContent=names[data.slot]+' · '+data.frames.length+' 帧 · '+(data.complete?'采集完成':'中断记录')+' · 原始数据完整保留';let standbyU;if(Number.isFinite(data.standby)){const nearest=data.frames.reduce((a,b)=>Math.abs(b.raw-data.standby)<Math.abs(a.raw-data.standby)?b:a);standbyU=nearest.unwrapped;}const draw=()=>{plot(document.getElementById('continuous'),data.frames,'unwrapped',standbyU);plot(document.getElementById('raw'),data.frames,'raw',data.standby);};draw();addEventListener('resize',draw);const link=document.getElementById('data');link.hidden=false;link.href=url;})().catch(e=>{const n=document.getElementById('status');n.className='error';n.textContent=e.message;});
</script></html>
